<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>MON1 GAME</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root { --bg:#0b1020; --panel:#141d32; --line:rgba(161,180,220,.13); --muted:#91a0bd; --text:#f4f7ff; --violet:#7867ff; --green:#48d6a0; }
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(ellipse at 80% -10%,#25346a 0,transparent 38%),var(--bg); color:var(--text); font-family:Inter,Arial,sans-serif; padding:18px 15px 100px; }
button,input,select { font:inherit; }
button { border:0; cursor:pointer; color:white; font-weight:750; transition:transform .15s; }
button:active { transform:scale(.98); }
.app { max-width:560px; margin:auto; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.brand { font-weight:950; font-size:23px; letter-spacing:1.2px; }
.brand b { color:#9a8cff; }
.hero { background:linear-gradient(125deg,#6257db,#383b91 58%,#1c4774); border-radius:23px; padding:20px; margin-bottom:14px; box-shadow:0 15px 40px rgba(44,52,140,.25); }
.balance { font-size:32px; font-weight:950; margin:9px 0 4px; }
.profile { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:13px 15px; margin-bottom:20px; }
.avatar { width:42px; height:42px; border-radius:14px; background:linear-gradient(135deg,#4ccef0,#7668ff); display:grid; place-items:center; font-weight:900; font-size:19px; }
.pname { font-weight:800; }
.status { margin-left:auto; color:#b7adff; font-weight:800; font-size:11px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:19px; padding:16px; margin-bottom:11px; }
.primary { width:100%; border-radius:13px; padding:13px 15px; background:linear-gradient(100deg,var(--violet),#5b79e8); margin-top:14px; box-shadow:0 8px 20px rgba(98,91,230,.18); }
.primary.green { background:linear-gradient(100deg,#20ad8b,#42d6a3); color:#071a19; }
.primary:disabled { opacity:.45; cursor:not-allowed; }
.field { width:100%; margin-top:13px; border:1px solid var(--line); background:#0e1628; color:var(--text); border-radius:12px; padding:14px; outline:none; }
.hidden { display:none!important; }
.note { font-size:11px; color:var(--muted); margin-top:9px; }
.crash-box { height:180px; border-radius:17px; background:#0e1729; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.crash-number { font-size:43px; font-weight:950; }
.toast { position:fixed; top:15px; left:50%; transform:translateX(-50%); background:#202c47; border:1px solid var(--line); border-radius:12px; padding:11px 15px; z-index:10; font-size:12px; }
.tabs { position:fixed; bottom:0; left:0; right:0; background:rgba(10,15,29,.94); border-top:1px solid var(--line); padding:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; z-index:5; }
.tab { background:transparent; color:var(--muted); font-size:10px; padding:7px; }
.tab.selected { background:rgba(120,103,255,.14); color:#c4bcff; border-radius:12px; }
.grid25 { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:15px; }
.cell { aspect-ratio:1; border-radius:12px; background:#28395e; border:1px solid rgba(151,174,222,.16); font-size:21px; }
.cell.open { background:rgba(56,201,220,.15); }
.cell.mine { background:rgba(255,100,124,.17); }
</style>
</head>
<body>
<div class="app">
    <header class="top">
        <div><div class="brand">MON1 <b>GAME</b></div></div>
        <div style="color:#48d6a0; font-size:10px; font-weight:800;">● ONLINE</div>
    </header>

    <div id="loading" style="text-align:center; padding:20px;">Загрузка профиля...</div>

    <main id="main" class="hidden">
        <section class="hero">
            <div style="font-size:10px; color:#d8d5ff; font-weight:800; letter-spacing:1px;">БАЛАНС</div>
            <div class="balance" id="balance">0 🪙</div>
            <div style="font-size:11px; color:#dedcff;" id="heroName">Игрок</div>
        </section>

        <section class="profile">
            <div class="avatar" id="avatar">M</div>
            <div>
                <div class="pname" id="playerName">Игрок</div>
                <div style="font-size:11px; color:#91a0bd;">MON1 GAME</div>
            </div>
            <div class="status" id="playerStatus">Игрок</div>
        </section>

        <!-- ИГРЫ -->
        <section id="gamesPage">
            <div class="card">
                <div style="font-weight:850; margin-bottom:10px;">🎮 Игровой центр</div>
                <button class="primary" onclick="showPage('crashPage')">🚀 Краш (игра на валюту)</button>
                <button class="primary" onclick="showPage('minesPage')">💣 Мины (игра на валюту)</button>
                <button class="primary green" onclick="showPage('bonusPage')">🎁 Ежедневный бонус</button>
            </div>
        </section>

        <!-- КРАШ -->
        <section id="crashPage" class="hidden">
            <div class="card">
                <div style="font-weight:850;">🚀 Краш</div>
                <div style="font-size:11px; color:#91a0bd; margin-top:5px;">Успей забрать до краша!</div>
                <input type="number" class="field" id="crashBet" value="100" min="100">
                <div class="crash-box" style="margin-top:13px;">
                    <div class="crash-number" id="crashNumber">x1.00</div>
                    <div style="font-size:10px; color:#91a0bd;" id="crashCaption">ГОТОВ</div>
                </div>
                <button class="primary" id="startCrash">ЗАПУСТИТЬ</button>
                <button class="primary green hidden" id="cashoutCrash" style="margin-top:10px;">💰 ЗАБРАТЬ <span id="crashWin">0</span> 🪙</button>
                <div class="note" id="crashNote"></div>
            </div>
        </section>

        <!-- МИНЫ -->
        <section id="minesPage" class="hidden">
            <div class="card">
                <div style="font-weight:850;">💣 Мины</div>
                <input type="number" class="field" id="minesBet" value="100" min="100">
                <select class="field" id="bombCount">
                    <option value="3">3 мины</option>
                    <option value="5" selected>5 мин</option>
                    <option value="9">9 мин</option>
                </select>
                <button class="primary" id="startMines">НАЧАТЬ</button>
                <div id="minesGame" class="hidden">
                    <div class="grid25" id="minesGrid"></div>
                    <button class="primary green" id="cashoutMines" style="margin-top:15px;">💰 ЗАБРАТЬ <span id="minesWin">0</span> 🪙</button>
                </div>
                <div class="note" id="minesNote"></div>
            </div>
        </section>

        <!-- БОНУС -->
        <section id="bonusPage" class="hidden">
            <div class="card">
                <div style="font-weight:850;">🎁 Бонус</div>
                <button class="primary green" id="claimBonus" style="margin-top:10px;">ЗАБРАТЬ</button>
            </div>
        </section>
    </main>

    <nav class="tabs hidden" id="tabs">
        <button class="tab selected" onclick="showPage('gamesPage')">⌂ Главная</button>
        <button class="tab" onclick="showPage('crashPage')">🎮 Игры</button>
        <button class="tab" onclick="showPage('bonusPage')">🎁 Бонус</button>
    </nav>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0b1020'); tg.setBackgroundColor('#0b1020'); }
const initData = tg?.initData || '';
let profile = null, minesSession = null, crashSession = null, crashTimer = null;

const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toLocaleString('ru-RU');

function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
}

// Безопасный fetch с обработкой HTML-ошибок
async function api(path, body = {}) {
    try {
        const res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, initData })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } 
        catch(e) { console.error("Сервер вернул не JSON:", text); throw new Error("Ошибка сервера. Проверьте логи."); }
        
        if (!res.ok || data.ok === false) throw new Error(data.error || 'Ошибка запроса');
        return data;
    } catch(err) {
        console.error(`API Error (${path}):`, err);
        throw err;
    }
}

function updateBalance(val) {
    if (profile) {
        profile.balance = val;
        $('balance').innerHTML = money(val) + ' <span style="font-size:16px;">🪙</span>';
    }
}

function showPage(id) {
    ['gamesPage', 'crashPage', 'minesPage', 'bonusPage'].forEach(p => $(p).classList.toggle('hidden', p !== id));
    document.querySelectorAll('.tab').forEach((tab, i) => {
        const pages = ['gamesPage', 'crashPage', 'bonusPage'];
        tab.classList.toggle('selected', pages[i] === id || (id === 'minesPage' && i === 1));
    });
}

async function loadProfile() {
    if (!initData) { $('loading').textContent = 'Открой через Telegram'; return; }
    try {
        profile = await api('/api/me');
        $('loading').classList.add('hidden');
        $('main').classList.remove('hidden');
        $('tabs').classList.remove('hidden');
        updateBalance(profile.balance);
        $('playerName').textContent = profile.name;
        $('heroName').textContent = profile.name;
        $('playerStatus').textContent = profile.status;
        $('avatar').textContent = (profile.name || 'M')[0].toUpperCase();
    } catch(e) { $('loading').textContent = e.message; }
}

// БОНУС
$('claimBonus').addEventListener('click', async () => {
    try {
        const d = await api('/api/bonus');
        updateBalance(d.balance);
        toast(`🎉 Получено ${money(d.reward)} 🪙`);
    } catch(e) { toast(e.message); }
});

// МИНЫ
$('startMines').addEventListener('click', async () => {
    const bet = Number($('minesBet').value);
    if (bet < 100) return toast('Мин. ставка 100 🪙');
    try {
        const d = await api('/api/mines/start', { bombs: Number($('bombCount').value), bet });
        minesSession = d.session;
        updateBalance(d.balance);
        $('minesGame').classList.remove('hidden');
        $('startMines').disabled = true;
        renderMines([], [], true);
        $('minesWin').textContent = '0';
        $('cashoutMines').classList.add('hidden');
    } catch(e) { toast(e.message); }
});

function renderMines(opened, mines = [], active = true) {
    const grid = $('minesGrid'); grid.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const b = document.createElement('button');
        b.className = 'cell'; b.textContent = '?';
        b.disabled = !active || opened.includes(i) || mines.includes(i);
        if (opened.includes(i)) { b.classList.add('open'); b.textContent = '💎'; }
        if (mines.includes(i)) { b.classList.add('mine'); b.textContent = '💣'; }
        b.onclick = () => openMine(i);
        grid.appendChild(b);
    }
}

async function openMine(cell) {
    if (!minesSession) return;
    try {
        const d = await api('/api/mines/open', { session: minesSession, cell });
        renderMines(d.opened, d.mines || [], d.active);
        if (d.hit) {
            $('minesNote').textContent = '💥 Мина! Ставка сгорела.';
            minesSession = null; $('startMines').disabled = false;
            updateBalance(d.balance); toast('Вы проиграли!');
        } else if (!d.active) {
            $('minesNote').textContent = `🏆 Поле очищено! Выигрыш: ${money(d.auto_win)} 🪙`;
            minesSession = null; $('startMines').disabled = false;
            updateBalance(d.balance); toast(`Выигрыш ${money(d.auto_win)} 🪙!`);
        } else {
            const mults = {3: 1.15, 5: 1.25, 9: 1.45};
            const win = Math.floor(Number($('minesBet').value) * (mults[Number($('bombCount').value)] ** d.opened.length));
            $('minesWin').textContent = money(win);
            $('cashoutMines').classList.remove('hidden');
            $('minesNote').textContent = 'Безопасно!';
        }
    } catch(e) { $('minesNote').textContent = e.message; }
}

$('cashoutMines').addEventListener('click', async () => {
    if (!minesSession) return;
    try {
        const d = await api('/api/mines/cashout', { session: minesSession });
        updateBalance(d.balance);
        $('minesNote').textContent = `🏆 Забрано ${money(d.win)} 🪙`;
        $('minesGame').classList.add('hidden');
        $('startMines').disabled = false; minesSession = null;
        toast(`Забрано ${money(d.win)} 🪙`);
    } catch(e) { toast(e.message); }
});

// КРАШ
$('startCrash').addEventListener('click', async () => {
    if (crashTimer) clearInterval(crashTimer);
    const bet = Number($('crashBet').value);
    if (bet < 100) return toast('Мин. ставка 100 🪙');
    try {
        const d = await api('/api/crash/start', { bet });
        crashSession = d.session;
        updateBalance(d.balance);
        $('crashNumber').textContent = 'x1.00';
        $('crashCaption').textContent = 'РАУНД ИДЁТ';
        $('startCrash').disabled = true;
        $('cashoutCrash').classList.remove('hidden');
        $('crashNote').textContent = 'Успей забрать!';
        crashTimer = setInterval(pollCrash, 350);
    } catch(e) { toast(e.message); }
});

async function pollCrash() {
    if (!crashSession) return;
    try {
        const d = await api('/api/crash/state', { session: crashSession });
        $('crashNumber').textContent = 'x' + Number(d.multiplier).toFixed(2);
        $('crashWin').textContent = money(Math.floor(Number($('crashBet').value) * d.multiplier));
        if (d.crashed) {
            clearInterval(crashTimer); crashTimer = null; crashSession = null;
            $('crashCaption').textContent = 'КРАШ!';
            $('crashNote').textContent = 'Ставка сгорела.';
            $('startCrash').disabled = false;
            $('cashoutCrash').classList.add('hidden');
            toast('Краш! Вы проиграли.');
        }
    } catch(e) {
        clearInterval(crashTimer); crashTimer = null; crashSession = null;
        $('startCrash').disabled = false; $('crashNote').textContent = e.message;
        $('cashoutCrash').classList.add('hidden');
    }
}

$('cashoutCrash').addEventListener('click', async () => {
    if (!crashSession) return;
    try {
        const d = await api('/api/crash/cashout', { session: crashSession });
        clearInterval(crashTimer); crashTimer = null; crashSession = null;
        updateBalance(d.balance);
        $('crashCaption').textContent = 'ЗАБРАНО';
        $('crashNote').textContent = `Забрано ${money(d.win)} 🪙`;
        $('startCrash').disabled = false;
        $('cashoutCrash').classList.add('hidden');
        toast(`Забрано ${money(d.win)} 🪙`);
    } catch(e) { toast(e.message); pollCrash(); }
});

loadProfile();
</script>
</body>
</html>
